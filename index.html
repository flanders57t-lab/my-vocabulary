<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1f6feb" />
  <meta name="description" content="여러 품사를 한 단어에 묶어 저장하는 개인 영어 단어장 PWA" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./style.css" />
  <title>내 영어 단어장</title>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div>
        <h1 id="page-title">내 단어장</h1>
        <p id="page-subtitle" class="muted">저장된 단어를 확인하세요.</p>
      </div>
      <button id="install-btn" class="icon-btn hidden" type="button" aria-label="앱 설치">설치</button>
    </header>

    <main class="content">
      <section id="view-vocab" class="view active" aria-labelledby="page-title">
        <div class="toolbar-card">
          <div class="count-line"><strong id="word-count">0</strong>개 저장됨</div>
          <label class="sr-only" for="vocab-search">단어장 검색</label>
          <input id="vocab-search" class="input" type="search" placeholder="영어 단어·품사·한국어 뜻 검색" autocomplete="off" />
          <div class="row gap-sm">
            <label class="sr-only" for="sort-select">정렬</label>
            <select id="sort-select" class="input select">
              <option value="newest">최근 저장순</option>
              <option value="oldest">오래된 순</option>
              <option value="alphabetical">알파벳순</option>
            </select>
            <button id="settings-toggle" class="btn btn-secondary" type="button">관리</button>
          </div>
        </div>

        <div id="manage-panel" class="panel hidden">
          <h2>단어장 관리</h2>
          <div class="stack gap-sm">
            <button id="backup-btn" class="btn btn-secondary" type="button">📤 단어장 백업</button>
            <label class="btn btn-secondary file-label" for="restore-file">📥 단어장 복원</label>
            <input id="restore-file" type="file" accept="application/json,.json" hidden />
            <button id="delete-all-btn" class="btn btn-danger" type="button">🗑 전체 단어 삭제</button>
          </div>
          <p class="help">로그인 없이 이 기기에 저장됩니다. 휴대폰 변경·브라우저 데이터 삭제에 대비해 백업을 권장합니다.</p>
        </div>

        <div id="vocab-list" class="card-list" aria-live="polite"></div>
        <div id="empty-state" class="empty-state">
          <div class="empty-icon">📚</div>
          <p>저장된 단어가 없습니다.</p>
          <button id="empty-add-btn" class="btn btn-primary" type="button">첫 단어 추가하기</button>
        </div>
      </section>

      <section id="view-add" class="view" aria-labelledby="page-title">
        <div class="card edit-card">
          <h2>새 단어 입력</h2>
          <p class="help">영어 단어 하나에 품사를 여러 개 추가할 수 있습니다. 각 품사마다 뜻·예문·해석을 따로 입력합니다.</p>

          <label class="field-label" for="edit-word">영어 단어 <span aria-hidden="true">*</span></label>
          <div class="inline-field">
            <input id="edit-word" class="input" type="text" inputmode="text" autocomplete="off" placeholder="예: present" />
            <button id="speak-word-btn" class="speak-btn inline-speak" type="button" aria-label="단어 발음 듣기">🔊</button>
          </div>

          <div class="section-head">
            <div>
              <h3>품사별 내용</h3>
              <p class="help no-top">품사를 추가하면 뜻·예문·해석 입력란이 함께 생깁니다.</p>
            </div>
            <button id="add-sense-btn" class="btn btn-secondary" type="button">＋ 품사 추가</button>
          </div>
          <div id="sense-editor" class="sense-editor"></div>

          <div id="status-box" class="status hidden" role="status" aria-live="polite"></div>

          <div class="row gap-sm form-actions">
            <button id="clear-entry-btn" class="btn btn-secondary" type="button">입력 초기화</button>
            <button id="save-word-btn" class="btn btn-primary" type="button">⭐ 단어장에 저장</button>
          </div>
        </div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="주요 메뉴">
      <button class="nav-btn active" data-view="vocab" type="button"><span>📚</span><span>단어장</span></button>
      <button class="nav-btn" data-view="add" type="button"><span>➕</span><span>새 단어</span></button>
    </nav>
  </div>

  <dialog id="edit-dialog" class="dialog">
    <form method="dialog" id="edit-form" class="dialog-card">
      <div class="dialog-head">
        <h2>단어 수정</h2>
        <button class="icon-btn" value="cancel" aria-label="닫기">✕</button>
      </div>
      <input id="dialog-id" type="hidden" />

      <label class="field-label" for="dialog-word">영어 단어</label>
      <div class="inline-field">
        <input id="dialog-word" class="input" type="text" />
        <button id="dialog-speak-word-btn" class="speak-btn inline-speak" type="button" aria-label="단어 발음 듣기">🔊</button>
      </div>

      <div class="section-head dialog-section-head">
        <h3>품사별 내용</h3>
        <button id="dialog-add-sense-btn" class="btn btn-secondary" type="button">＋ 품사 추가</button>
      </div>
      <div id="dialog-sense-editor" class="sense-editor"></div>

      <div class="dialog-actions">
        <button class="btn btn-secondary" value="cancel">취소</button>
        <button id="dialog-save" class="btn btn-primary" value="default">저장</button>
      </div>
    </form>
  </dialog>

  <template id="sense-template">
    <section class="sense-block">
      <div class="sense-block-head">
        <strong class="sense-number">품사 1</strong>
        <button class="btn btn-danger btn-small remove-sense-btn" type="button">삭제</button>
      </div>

      <label class="field-label">품사</label>
      <input class="input sense-pos" type="text" placeholder="예: 명사, 동사, 형용사" />

      <label class="field-label">한국어 뜻</label>
      <textarea class="input textarea sense-meaning" rows="3" placeholder="이 품사에서의 뜻을 입력하세요"></textarea>

      <label class="field-label">영어 예문</label>
      <div class="inline-field">
        <textarea class="input textarea sense-example" rows="3" placeholder="이 품사에 맞는 예문을 입력하세요"></textarea>
        <button class="speak-btn inline-speak sense-speak-example" type="button" aria-label="예문 발음 듣기">🔊</button>
      </div>

      <label class="field-label">예문 해석</label>
      <textarea class="input textarea sense-translation" rows="3" placeholder="예문 해석을 입력하세요"></textarea>
    </section>
  </template>

  <script type="module" src="./app.js"></script>
</body>
</html>
